apply plugin: 'com.android.application'

android {
    namespace = "com.hobsfoundation.companion"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.hobsfoundation.companion"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 79
        versionName "3.59-mood-mic-transcription-fixes"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            storeFile file('hobs-release.keystore')
            storePassword 'hobsbeta2026'
            keyAlias 'hobs'
            keyPassword 'hobsbeta2026'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:1.12.1"
    // Real fix, Aug 29, 2026: replaces the web-based checkout.js approach entirely for the
    // native in-app flow. That approach fundamentally couldn't work right inside this app's own
    // WebView -- `redirect: true` navigates the WebView itself away from this app's bundled
    // content to Razorpay's own page, which isn't a modal or overlay, it's a real navigation
    // away from a single-page app holding a lot of live, running state. Coming back left the
    // app and Razorpay's stale page visibly out of sync, and there was never a clean way to
    // "go back" from that, which is what the back-button issue actually was underneath. The
    // real, Razorpay-recommended fix for exactly this situation is their native SDK: it opens
    // as a genuinely separate Activity that never touches this app's WebView or its state at
    // all, and hands back a clean result when it's done, which is what donate.html (a real
    // browser tab, where the web checkout was never broken in the first place) never needed.
    implementation 'com.razorpay:checkout:1.6.40'
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Real, deliberate change, Sept 20 2026, per direct instruction, after this exact silent gap
// caused a real production crash: previously, a missing google-services.json here was only
// ever logged at INFO level and swallowed -- easy to miss, and the build succeeded anyway with
// push-notifications' Firebase dependency compiled in but genuinely unconfigured, which is a
// well-documented cause of an immediate crash on real devices. Confirmed directly this file had
// silently gone missing from this exact build before, with nothing catching it until a real
// phone crashed on open. Now fails the build outright and loudly if this file is missing,
// rather than ever again letting a broken build reach a real device silently.
def servicesJSON = file('google-services.json')
if (!servicesJSON.exists()) {
    throw new GradleException(
        "google-services.json is missing from android/app/. This build depends on " +
        "@capacitor/push-notifications, which requires real Firebase configuration to " +
        "initialize safely -- without this file, the app compiles fine but crashes " +
        "immediately on open on a real device (confirmed directly, this has happened twice). " +
        "Restore the tracked copy from android-native-assets/firebase/google-services.json " +
        "before building again."
    )
}
apply plugin: 'com.google.gms.google-services'
